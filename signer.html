<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/signer.js" defer></script>
    <title>Singing offcanvas</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            display: flex;
        }

        .offcanvas-trigger {
            background-color: #f0f0f0;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            margin: 20px;
        }

        .offcanvas {
            height: 100vh;
            width: 1000px;
            background-color: #fff;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
            position: fixed;
            top: 0;
            right: -1000px;
            transition: transform 0.3s ease-in-out;
            padding: 20px;
            box-sizing: border-box;
        }

        @media (max-width: 768px) {
        .offcanvas {
            width: 100vw;
            height: 100vh;
        }
        }

        .offcanvas.open {
            transform: translateX(-1000px); /* show */
        }

        #signatureCanvas {
            border: 1px solid #ccc;
            width: 100%;
            height: 200px;
            cursor: crosshair;
            margin: auto;
            display: block;
        }

        .offcanvas-controls button {
            padding: 8px 15px;
            margin-top: 10px;
            cursor: pointer;
        }

        #resizeHandle {
            position: absolute;
            bottom: 0px; 
            right: 0px;
            top: 0px;
            margin-top: 10px;
            cursor: se-resize; 
            width: 20px; 
            height: 20px; 
            background-color: #ccc; 
        }

        .offcanvas-controls {
            position: relative;
        }
    </style>
</head>
<body>

    <button class="offcanvas-trigger">Open singing offcanvas</button>

    <div class="offcanvas">
        <h2>Sign</h2>
        <canvas id="signatureCanvas"></canvas>
        <div class="offcanvas-controls">
            <button id="saveSignature">Save</button>
            <button id="clearCanvas">Clear</button>
            <button class="offcanvas-close" id="closeOffcanvas">Close</button>
            <div id="resizeHandle">↕</div>
        </div>
    </div>
</body>
</html>
