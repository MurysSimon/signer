<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/signer.js" defer></script>
    <title>Singing offcanvas</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            width: 100vw;
            height: 100vh;
        }

        .signature-component {
            margin: auto;
        }

        #signatureCanvas {
            border: 1px solid #ccc;
            cursor: crosshair;
            margin: auto;
            display: block;
            min-width: 300px;
            min-height: 200px;
        }

        .offcanvas-controls button {
            padding: 8px 15px;
            margin-top: 10px;
            cursor: pointer;
        }

        .offcanvas-controls {
            position: relative;
        }
    </style>
</head>
<body>
<div class="signature-component">
    <h2>Sign</h2>
    <div>
        <canvas id="signatureCanvas"></canvas>
        <div class="offcanvas-controls">
            <button id="saveSignature">Save</button>
            <button id="clearCanvas">Clear</button>
            <button class="offcanvas-close" id="closeOffcanvas">Close</button>
        </div>
    </div>
</div>
</body>
</html>
