<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/signer.js" defer></script>
    <title>Singing offcanvas</title>
    <style>
        .signature-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            font-family: sans-serif;
        }

        .signature-header {
            text-align: center;
            margin: 0.5em 0;
        }

        .signature-canvas-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        canvas {
            width: 100%;
            height: 100%;
            border: 1px solid #ccc;
            touch-action: none;
        }

        .offcanvas-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 10px 0;
        }

        .offcanvas-controls button {
            padding: 8px 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="signature-container" id="signatureComponent">
      <h2 class="signature-header">Sign</h2>
      <div class="signature-canvas-wrapper">
        <canvas id="signatureCanvas"></canvas>
      </div>
      <div class="offcanvas-controls">
        <button id="saveSignature">Save</button>
        <button id="clearCanvas">Clear</button>
        <button id="closeOffcanvas">Close</button>
      </div>
    </div>
  </body>
</html>
